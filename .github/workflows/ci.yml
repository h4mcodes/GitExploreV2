name: CI Pipeline

on:
  push:
    branches: [main, v2-fullstack]
  pull_request:
    branches: [main, v2-fullstack]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Validate Frontend TypeScript & Build
        run: npm run build

  validate-backend:
    name: Backend Build, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Validate Backend TypeScript & Build
        working-directory: backend
        run: npm run build

      - name: Run Backend Vitest Test Suite
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-32-chars-minimum-token
          CORS_ORIGIN: http://localhost:5173
